const STEELS = BOXES.filter(b => b.kind === 'steel');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d21);
scene.fog = new THREE.Fog(0x1a1d21, 9000, 20000);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 50000);
camera.position.set(3200, 2400, 2800);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1400, 700, 900);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.05));
const dir = new THREE.DirectionalLight(0xffffff, 1.25);
dir.position.set(2000, 5000, 1500);
scene.add(dir);
scene.add(new THREE.AmbientLight(0xffffff, 0.28));
scene.add(new THREE.AxesHelper(500));

const steelMat = new THREE.MeshStandardMaterial({ color: 0x8e97a1, metalness: 0.55, roughness: 0.4 });
const railMat = new THREE.MeshStandardMaterial({ color: 0xa8b0ba, metalness: 0.45, roughness: 0.42 });
const diagMat = new THREE.MeshStandardMaterial({ color: 0xc4a574, metalness: 0.5, roughness: 0.35 });
const markerMat = new THREE.MeshStandardMaterial({ color: 0xff8c42, transparent: true, opacity: 0.35, depthWrite: false });
const hiMat = new THREE.MeshStandardMaterial({ color: 0xf0b429, emissive: 0x553300, metalness: 0.3, roughness: 0.4 });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x2c3136 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2e34, roughness: 0.95 });

function toThree(x, y, z) { return new THREE.Vector3(x, z, y); }

const root = new THREE.Group();
const meshById = new Map();
const labelGroup = new THREE.Group();
const overallGroup = new THREE.Group();
scene.add(root); scene.add(labelGroup); scene.add(overallGroup);

function makeLabel(text, pos, scale=300) {
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 72;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(10,12,16,0.78)';
  roundRect(ctx, 8, 12, 304, 48, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,122,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffe6a8'; ctx.font = '700 26px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 160, 36);
  const tex = new THREE.CanvasTexture(canvas);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true }));
  sp.scale.set(scale, scale * 0.225, 1);
  sp.position.copy(pos);
  return sp;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

BOXES.forEach(b => {
  let mesh;
  if (b.diag) {
    const p1 = toThree(b.x1, b.y1, b.z1);
    const p2 = toThree(b.x2, b.y2, b.z2);
    const len = p1.distanceTo(p2);
    const geo = new THREE.BoxGeometry(b.dx, b.dx, len);
    mesh = new THREE.Mesh(geo, diagMat.clone());
    mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
    mesh.lookAt(p2);
    // lookAt points local -Z toward target; our length is along Z — OK for tube
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
  } else {
    const geo = new THREE.BoxGeometry(b.dx, b.dz, b.dy);
    let mat = steelMat;
    if (b.kind === 'floor') mat = floorMat;
    else if (b.kind === 'marker') mat = markerMat;
    else if ((b.name||'').includes('围挡')) mat = railMat;
    mesh = new THREE.Mesh(geo, mat === floorMat || mat === markerMat ? mat : mat.clone());
    mesh.position.copy(toThree(b.cx, b.cy, b.cz));
    if (b.kind === 'steel') {
      mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
    }
  }
  mesh.userData = b;
  if (b.kind === 'steel') {
    mesh.castShadow = true;
    meshById.set(b.id, mesh);
    if (b.showLabel) {
      labelGroup.add(makeLabel(String(b.len), toThree(b.cx, b.cy, b.cz + 40), b.len >= 1000 ? 360 : 280));
    }
  } else if (b.kind === 'marker') {
    meshById.set(b.id, mesh);
    labelGroup.add(makeLabel('爬梯口600', toThree(b.cx, b.cy + 60, b.cz + 80), 340));
  }
  root.add(mesh);
});

function addDimLine(a, b, color=0xffcc66) {
  overallGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([a,b]),
    new THREE.LineBasicMaterial({ color })
  ));
}
[
  { a:[0,0,0], b:[2200,0,0], t:'床长2200', m:[1100,-150,0] },
  { a:[0,0,0], b:[0,1200,0], t:'床宽1200', m:[-150,600,0] },
  { a:[0,0,0], b:[0,0,1400], t:'净高1400', m:[-180,-180,700] },
  { a:[2200,0,0], b:[2750,0,0], t:'梯宽550', m:[2475,-120,0] },
  { a:[2200,550,0], b:[2200,1800,0], t:'水平投影1800', m:[2050,1175,0] },
  { a:[2750,1800,0], b:[2750,550,1400], t:'斜杆~DIAG', m:[2950,1100,700] },
  { a:[2750,550,0], b:[2750,550,1460], t:'落地柱', m:[2920,550,730] },
  { a:[0,1200,1800], b:[600,1200,1800], t:'爬梯口600', m:[300,1350,1900] },
].forEach(d => {
  addDimLine(toThree(...d.a), toThree(...d.b));
  overallGroup.add(makeLabel(d.t.replace('DIAG', String(1877)), toThree(...d.m), 340));
});

const listEl = document.getElementById('list');
const totalLen = STEELS.reduce((s,b)=>s+b.len, 0);
document.getElementById('countLine').textContent =
  `共 ${STEELS.length} 根 · 约 ${(totalLen/1000).toFixed(1)} m · 斜杆 ${1877} mm×2`;

function addSec(t){ const d=document.createElement('div'); d.className='sec'; d.textContent=t; listEl.appendChild(d); }
function addRow(b){
  const row=document.createElement('div'); row.className='row'; row.dataset.id=b.id;
  row.innerHTML=`<span>${b.id}</span><span class="len">${b.len}</span><span>${b.name}</span>`;
  row.onclick=()=>highlight(b.id,true); listEl.appendChild(row);
}
addSec('上床'); STEELS.filter(b=>b.name.startsWith('上床')).forEach(addRow);
addSec('围挡'); STEELS.filter(b=>b.name.includes('围挡')).forEach(addRow);
addSec('楼梯斜杆+踏步+平台'); STEELS.filter(b=>!(b.name.startsWith('上床')||b.name.includes('围挡'))).forEach(addRow);

let current=null;
function highlight(id, focus=false){
  if(current && meshById.has(current)){
    const p=meshById.get(current), n=p.userData.name||'';
    if(p.userData.kind==='marker') p.material=markerMat;
    else if(p.userData.diag) p.material=diagMat.clone();
    else if(n.includes('围挡')) p.material=railMat.clone();
    else p.material=steelMat.clone();
  }
  current=id;
  document.querySelectorAll('#list .row').forEach(r=>r.classList.toggle('active', r.dataset.id===id));
  const mesh=meshById.get(id); if(!mesh||mesh.userData.kind==='marker') return;
  mesh.material=hiMat;
  const tip=document.getElementById('tip'); const b=mesh.userData;
  tip.style.display='block';
  tip.textContent=`${b.id}  ${b.name}  下料 ${b.len} mm`;
  if(focus){
    controls.target.copy(mesh.position);
    const d=camera.position.clone().sub(controls.target).setLength(2200);
    camera.position.copy(controls.target.clone().add(d));
  }
}

const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (ev)=>{
  if(ev.button!==0) return;
  pointer.x=(ev.clientX/innerWidth)*2-1; pointer.y=-(ev.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hits=raycaster.intersectObjects([...meshById.values()].filter(m=>m.userData.kind==='steel'), false);
  if(hits.length) highlight(hits[0].object.userData.id, false);
});

document.getElementById('btnReset').onclick=()=>{
  camera.position.set(3200,2400,2800); controls.target.set(1400,700,900);
};
document.getElementById('btnTube').onclick=()=>{ labelGroup.visible=!labelGroup.visible; };
document.getElementById('btnOverall').onclick=()=>{ overallGroup.visible=!overallGroup.visible; };
overallGroup.visible = true;

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
