function addBar(group, a, b, mat, thick=DIM_T) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1) return;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(thick, thick, len), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.lookAt(b);
  mesh.renderOrder = 2;
  group.add(mesh);
}

/** 纯数字（无方格），屏幕恒定大小，细小可读 */
function makeDimText(text, pos) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const canvas = document.createElement('canvas');
  canvas.width = 320 * dpr; canvas.height = 96 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, 320, 96);
  ctx.font = '600 36px "PingFang SC","Helvetica Neue",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = 36;
  while (fs > 24 && ctx.measureText(text).width > 290) {
    fs -= 2; ctx.font = `600 ${fs}px "PingFang SC","Helvetica Neue",sans-serif`;
  }
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,10,14,0.85)';
  ctx.strokeText(text, 160, 48);
  ctx.fillStyle = '#ffe08a';
  ctx.fillText(text, 160, 48);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false,
    sizeAttenuation: false,
  }));
  const w = isMobile ? 0.11 : 0.08;
  sp.scale.set(w, w * 0.3, 1);
  sp.position.copy(pos);
  sp.renderOrder = 20;
  return sp;
}

function gapForText(text, dimLen) {
  const n = String(text).replace(/\s/g,'').length;
  return Math.min(dimLen * 0.32, Math.max(55, n * 36));
}

/** 标准 CAD：引出线 + 尺寸线中间断开写数字 ——557—— */
function addCadDim(group, p1, p2, text, offset) {
  const o = offset.clone();
  if (o.lengthSq() < 1) return;
  const a = p1.clone().add(o);
  const b = p2.clone().add(o);
  const dimDir = new THREE.Vector3().subVectors(b, a);
  const dimLen = dimDir.length();
  if (dimLen < 1) return;
  dimDir.multiplyScalar(1 / dimLen);
  // 引出线（构件端点 → 尺寸线）
  addBar(group, p1, a, dimExtMeshMat, 2.5);
  addBar(group, p2, b, dimExtMeshMat, 2.5);
  // 尺寸线两段 + 中间缺口
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const gap = gapForText(text, dimLen);
  const g0 = mid.clone().addScaledVector(dimDir, -gap/2);
  const g1 = mid.clone().addScaledVector(dimDir,  gap/2);
  if (a.distanceTo(g0) > 12) addBar(group, a, g0, dimMeshMat);
  if (g1.distanceTo(b) > 12) addBar(group, g1, b, dimMeshMat);
  // 端刻度
  let tick = new THREE.Vector3().crossVectors(dimDir, o).normalize();
  if (tick.lengthSq() < 1e-6) {
    tick = new THREE.Vector3().crossVectors(dimDir, new THREE.Vector3(0,1,0)).normalize();
  }
  if (tick.lengthSq() < 1e-6) tick.set(1,0,0);
  const th = 28;
  addBar(group, a.clone().addScaledVector(tick,-th), a.clone().addScaledVector(tick,th), dimMeshMat, 3);
  addBar(group, b.clone().addScaledVector(tick,-th), b.clone().addScaledVector(tick,th), dimMeshMat, 3);
  group.add(makeDimText(text, mid.clone().addScaledVector(o.clone().normalize(), 28)));
}

/** 给一根钢管做 CAD 尺寸（外偏，一眼能看见） */
function addMemberCad(group, b, offset) {
  let p1, p2;
  if (b.diag) {
    p1 = toThree(b.x1, b.y1, b.z1);
    p2 = toThree(b.x2, b.y2, b.z2);
  } else {
    const p = toThree(b.cx, b.cy, b.cz);
    let axis = 'z', L = b.dz;
    if (b.dx >= b.dy && b.dx >= b.dz) { axis = 'x'; L = b.dx; }
    else if (b.dy >= b.dz) { axis = 'y'; L = b.dy; }
    if (axis === 'z') {
      p1 = p.clone().add(new THREE.Vector3(0, -L/2, 0));
      p2 = p.clone().add(new THREE.Vector3(0,  L/2, 0));
    } else if (axis === 'x') {
      p1 = p.clone().add(new THREE.Vector3(-L/2, 0, 0));
      p2 = p.clone().add(new THREE.Vector3( L/2, 0, 0));
    } else {
      p1 = p.clone().add(new THREE.Vector3(0, 0, -L/2));
      p2 = p.clone().add(new THREE.Vector3(0, 0,  L/2));
    }
  }
  addCadDim(group, p1, p2, String(b.len), offset);
}

BOXES.forEach(b => {

  let mesh;
  if (b.diag) {
    const p1 = toThree(b.x1, b.y1, b.z1);
    const p2 = toThree(b.x2, b.y2, b.z2);
    const len = p1.distanceTo(p2);
    const geo = new THREE.BoxGeometry(b.dx, b.dx, len);
    mesh = new THREE.Mesh(geo, steelMatFor(b).clone());
    mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
    mesh.lookAt(p2);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
  } else {
    const geo = new THREE.BoxGeometry(b.dx, b.dz, b.dy);
    let mat = steelMat;
    if (b.kind === 'floor') mat = floorMat;
    else if (b.kind === 'marker') mat = markerMat;
    else mat = steelMatFor(b);
    mesh = new THREE.Mesh(geo, mat === floorMat || mat === markerMat ? mat : mat.clone());
    mesh.position.copy(toThree(b.cx, b.cy, b.cz));
    if (b.kind === 'steel' || b.kind === 'seg') {
      mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
    }
  }
  mesh.userData = b;
  if (b.kind === 'steel' || b.kind === 'seg') {
    mesh.castShadow = !isMobile;
    meshById.set(b.id, mesh);
  } else if (b.kind === 'marker') {
    meshById.set(b.id, mesh);
  }
  root.add(mesh);
});

/** 下料长轴：x=床长 y=床宽 z=高 d=斜 */
function longAxisOf(b){
  if (b.diag) return 'd';
  if (b.dx >= b.dy && b.dx >= b.dz) return 'x';
  if (b.dy >= b.dz) return 'y';
  return 'z';
}
function poseOf(b){
  const ax = longAxisOf(b);
  if (ax === 'd') return {
    key:'diag', badge:'斜', title:'斜着放',
    how:'斜着焊', sub:'两头对到接头位置，按斜长下料'
  };
  if (ax === 'z') return {
    key:'up', badge:'立', title:'立着放',
    how:'立着焊', sub:'像柱子竖起来，插在上下两根横杆之间'
  };
  if (ax === 'x') return {
    key:'flat', badge:'横', title:'横着放',
    how:'横着焊', sub:'平躺，长边顺着床的长度方向'
  };
  return {
    key:'flat', badge:'横', title:'横着放',
    how:'横着焊', sub:'平躺，长边顺着床的宽度方向'
  };
}
function sectionOrient(b){
  /** 端面怎么看：画一个口，标 40/60 朝哪边 */
  const r = (n)=>Math.round(n);
  const ax = longAxisOf(b);
  if (ax === 'd') {
    const s = r(b.dx);
    return {
      square: true,
      w: s, h: s,
      hLabel: '左右', vLabel: '上下',
      view: '斜杆端面',
      rule: '截面差不多是方的，转一下对齐接头即可',
      sub: '不用死磕 40/60 朝向'
    };
  }
  let w, h, hLabel, vLabel, view, rule, sub;
  if (ax === 'z') {
    // 立柱：从上面往下看（或看端面）
    w = r(b.dx); h = r(b.dy);
    hLabel = '床长（头↔尾）';
    vLabel = '床宽（墙↔房间）';
    view = '立着焊 · 从一头往里看';
  } else if (ax === 'x') {
    // 沿床长横放：从床头/床尾看端面
    w = r(b.dy); h = r(b.dz);
    hLabel = '床宽（墙↔房间）';
    vLabel = '高度（上↔下）';
    view = '横着焊 · 从床头/床尾看端面';
  } else {
    // 沿床宽横放：从靠墙/朝房间看端面
    w = r(b.dx); h = r(b.dz);
    hLabel = '床长（头↔尾）';
    vLabel = '高度（上↔下）';
    view = '横着焊 · 从侧面看端面';
  }
  const square = (w === h);
  if (square) {
    rule = `方管 ${w}×${h}，不用分正反`;
    sub = '';
  } else {
    const wide = Math.max(w, h), narrow = Math.min(w, h);
    const wideIsH = w >= h;
    if (wideIsH) {
      rule = `${wide} 朝「${shortDir(hLabel)}」，${narrow} 朝「${shortDir(vLabel)}」`;
    } else {
      rule = `${wide} 朝「${shortDir(vLabel)}」，${narrow} 朝「${shortDir(hLabel)}」`;
    }
    sub = '';
  }
  return { square, w, h, hLabel, vLabel, view, rule, sub };
}
function shortDir(label){
  // 床长（头↔尾）→ 床长；高度（上↔下）→ 上下
  if (label.includes('床长')) return '床长(头尾)';
  if (label.includes('床宽')) return '床宽(墙/房)';
  if (label.includes('高度')) return '上下';
  return label;
}
function sectionFaceOf(b){
  const o = sectionOrient(b);
  return { tip: o.rule };
}
/** 端面朝向图：口子上写清 40/60，并标房间方向 */
function sectionSvg(b){
  /** 立体端面：画出一小段方钢，端面标 40/60 */
  const o = sectionOrient(b);
  const W = 336, H = 230;
  const font = 'system-ui,\"PingFang SC\",sans-serif';
  const colW = '#f59e0b', colN = '#3b82f6';
  const wide = Math.max(o.w, o.h), narrow = Math.min(o.w, o.h);
  // 等轴测：一小段管子，长度沿视线略斜
  const s = 1.15;
  const ox = 150, oy = 150;
  const iso = (x,y,z) => [ox + (x - y) * 0.866 * s, oy + (x + y) * 0.5 * s - z * s];
  const poly = (pts, fill, stroke='#1f2937', sw=1.2) => {
    const d = pts.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    return `<polygon points="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  };
  // 端面尺寸（图上）：宽=o.w，高=o.h；管长画短一段
  const u = Math.max(o.w, o.h) || 1;
  const ew = 55 * (o.w / u), eh = 55 * (o.h / u), el = 90;
  // 局部坐标：x=宽，y=厚(进深感)，z=高；管子沿 y 伸出
  const box = (x0,y0,z0, dx,dy,dz, fills) => {
    const P = (x,y,z)=>iso(x0+x, y0+y, z0+z);
    const c000=P(0,0,0), c100=P(dx,0,0), c110=P(dx,dy,0), c010=P(0,dy,0);
    const c001=P(0,0,dz), c101=P(dx,0,dz), c111=P(dx,dy,dz), c011=P(0,dy,dz);
    return (
      poly([c010,c110,c111,c011], fills[0]) + // 左侧面
      poly([c100,c110,c111,c101], fills[1]) + // 右侧面
      poly([c001,c101,c111,c011], fills[2])   // 顶面
    );
  };
  // 端面（朝向观察者的近端 y=0）用更亮色，并写数字
  const P = (x,y,z)=>iso(x,y,z);
  const e00=P(0,0,0), e10=P(ew,0,0), e11=P(ew,0,eh), e01=P(0,0,eh);
  const hCol = (o.w >= o.h) ? colW : colN;
  const vCol = (o.h > o.w) ? colW : colN;
  const body =
    box(0, 0, 0, ew, el, eh, ['#4b5563', '#374151', '#6b7280']) +
    poly([e00,e10,e11,e01], 'rgba(251,191,36,.35)', '#fbbf24', 2.2) +
    `<text x="${((e00[0]+e10[0])/2).toFixed(1)}" y="${(e00[1]+12).toFixed(1)}" text-anchor="middle" fill="${hCol}" font-size="14" font-weight="800" font-family="${font}">${o.w}</text>` +
    `<text x="${(e00[0]-14).toFixed(1)}" y="${((e00[1]+e01[1])/2+4).toFixed(1)}" text-anchor="middle" fill="${vCol}" font-size="14" font-weight="800" font-family="${font}">${o.h}</text>` +
    `<text x="168" y="22" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="${font}">立体端面 · ${esc(o.view)}</text>` +
    `<text x="24" y="210" fill="#c5ccd3" font-size="11" font-family="${font}">←→ ${esc(o.hLabel)}</text>` +
    `<text x="200" y="210" fill="#c5ccd3" font-size="11" font-family="${font}">↑↓ ${esc(o.vLabel)}</text>` +
    `<rect x="24" y="218" width="10" height="10" rx="2" fill="${colW}"/>` +
    `<text x="40" y="227" fill="#fbbf24" font-size="11" font-family="${font}">宽边${wide}</text>` +
    `<rect x="110" y="218" width="10" height="10" rx="2" fill="${colN}"/>` +
    `<text x="126" y="227" fill="#93c5fd" font-size="11" font-family="${font}">窄边${narrow}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="${W}" height="${H}" fill="transparent"/>${body}</svg>`;
}
function tubeEnds(b){
  if (b.diag) {
    return [
      { tag:'这一头', p:[b.x1, b.y1, b.z1] },
      { tag:'那一头', p:[b.x2, b.y2, b.z2] },
    ];
  }
  const ax = longAxisOf(b);
  const h = b.len / 2;
  const c = [b.cx, b.cy, b.cz];
  if (ax === 'z') return [
    { tag:'下端', p:[c[0], c[1], c[2] - h] },
    { tag:'上端', p:[c[0], c[1], c[2] + h] },
  ];
  if (ax === 'x') return [
    { tag:'床头这边', p:[c[0] - h, c[1], c[2]] },
    { tag:'床尾那边', p:[c[0] + h, c[1], c[2]] },
  ];
  return [
    { tag:'靠墙这边', p:[c[0], c[1] - h, c[2]] },
    { tag:'朝房间那边', p:[c[0], c[1] + h, c[2]] },
  ];
}
function distPointAabb(p, b){
  const x0 = b.cx - b.dx/2, x1 = b.cx + b.dx/2;
  const y0 = b.cy - b.dy/2, y1 = b.cy + b.dy/2;
  const z0 = b.cz - b.dz/2, z1 = b.cz + b.dz/2;
  const dx = Math.max(x0 - p[0], 0, p[0] - x1);
  const dy = Math.max(y0 - p[1], 0, p[1] - y1);
  const dz = Math.max(z0 - p[2], 0, p[2] - z1);
  return Math.hypot(dx, dy, dz);
}
function distPointSeg(p, b){
  const ax=b.x1, ay=b.y1, az=b.z1, bx=b.x2, by=b.y2, bz=b.z2;
  const vx=bx-ax, vy=by-ay, vz=bz-az;
  const wx=p[0]-ax, wy=p[1]-ay, wz=p[2]-az;
  const vv = vx*vx+vy*vy+vz*vz || 1;
  let t = (wx*vx+wy*vy+wz*vz) / vv;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0]-(ax+t*vx), p[1]-(ay+t*vy), p[2]-(az+t*vz));
}
function touchesSteel(p, o, tol=22){
  if (o.diag) return distPointSeg(p, o) <= Math.max(tol, o.dx * 0.75);
  return distPointAabb(p, o) <= tol;
}
/** 把杆件名收成现场好认的短词，如「3级踢面」 */
function nickName(name){
  let n = String(name||'');
  n = n.replace(/踏步(\d+)(?:左|右)?/, '$1级');
  n = n.replace(/楼梯(?:左|右)?/, '');
  n = n.replace(/上床/, '');
  n = n.replace(/通横\d+/, '通横');
  n = n.replace(/踢面\d+/, '踢面');
  n = n.replace(/抽背横杆/, '抽背');
  n = n.replace(/外口横杆/, '外口');
  n = n.replace(/前下横杆/, '前下');
  n = n.replace(/地面横杆/, '地面');
  n = n.replace(/靠墙底横杆/, '靠墙底');
  n = n.replace(/中柱底横杆/, '中柱底');
  n = n.replace(/中柱下段/, '中柱下');
  n = n.replace(/中柱上段/, '中柱上');
  n = n.replace(/@\d+/g, '');
  n = n.replace(/[()（）]/g, '');
  n = n.replace(/\d+$/g, '');
  n = n.trim();
  if (n.length > 7) n = n.slice(0, 7);
  return n || '邻杆';
}
/** 每端邻居：图上用中文短名，说明里带编号 */
function jointEnds(b){
  return tubeEnds(b).map(e => {
    const hits = [];
    if (e.p[2] <= 10) hits.push({ nick:'地面', full:'地面（落地）', id:null });
    const pool = [...STEELS.filter(s => !s.noMesh), ...SEGS];
    for (const o of pool) {
      if (o.id === b.id) continue;
      if (!touchesSteel(e.p, o)) continue;
      const src = (o.kind === 'seg' && o.pieceId)
        ? (STEELS.find(s => s.id === o.pieceId) || o) : o;
      if (hits.some(h => h.id === src.id)) continue;
      hits.push({ nick:nickName(src.name), full:`${src.id} ${src.name}`, id:src.id });
      if (hits.length >= 2) break;
    }
    if (!hits.length) hits.push({ nick:'空着', full:'自由端 / 开口', id:null });
    return { tag:e.tag, hits };
  });
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/** 手绘风：只画一小段方钢线框，标长 / 宽 / 高 */
function assembleSvg(b){
  const pose = poseOf(b);
  const orient = sectionOrient(b);
  const ax = longAxisOf(b);
  const col = '#fbbf24', muted = '#9aa3ad';
  const W = 336, H = 200;
  const font = 'system-ui,\"PingFang SC\",sans-serif';
  const ox = 155, oy = 125, s = 1.1;
  const P = (x,y,z) => [ox + (x - y) * 0.86 * s, oy + (x + y) * 0.4 * s - z * s];
  const L = (p,q,c=col,w=1.8) =>
    `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const Tx = (p,txt,c=col,fs=12) =>
    `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" text-anchor="middle" fill="${c}" font-size="${fs}" font-weight="700" font-family="${font}">${esc(txt)}</text>`;

  const lenVal = b.len;
  const wVal = orient.w;
  const hVal = orient.h;
  const u = Math.max(wVal, hVal) || 40;
  const sw = 30 * (wVal / u);
  const sh = 30 * (hVal / u);
  const seg = 72;

  let title = '一小段示意';
  let c0, c1, pLen, pW, pH;

  if (pose.key === 'up' || ax === 'z') {
    title = '立着 · 一小段';
    c0 = [P(-sw/2,-sh/2,0), P(sw/2,-sh/2,0), P(sw/2,sh/2,0), P(-sw/2,sh/2,0)];
    c1 = [P(-sw/2,-sh/2,seg), P(sw/2,-sh/2,seg), P(sw/2,sh/2,seg), P(-sw/2,sh/2,seg)];
    pLen = P(sw/2 + 22, 0, seg/2);
    pW = P(0, -sh/2 - 16, 0);
    pH = P(-sw/2 - 18, 0, 4);
  } else if (pose.key === 'diag') {
    title = '斜着 · 一小段';
    const along = (t, dx=0, dy=0, dz=0) => P(-28+56*t+dx, 8-6*t+dy, 10+48*t+dz);
    c0 = [along(0,-sw/2,-sh/2,0), along(0,sw/2,-sh/2,0), along(0,sw/2,sh/2,0), along(0,-sw/2,sh/2,0)];
    c1 = [along(1,-sw/2,-sh/2,0), along(1,sw/2,-sh/2,0), along(1,sw/2,sh/2,0), along(1,-sw/2,sh/2,0)];
    pLen = along(0.5, 0, 0, sh/2 + 18);
    pW = along(0, 0, -sh/2 - 14, 0);
    pH = along(0, -sw/2 - 16, 0, sh/3);
  } else {
    title = '横着 · 一小段';
    c0 = [P(0,-sw/2,0), P(0,sw/2,0), P(0,sw/2,sh), P(0,-sw/2,sh)];
    c1 = [P(seg,-sw/2,0), P(seg,sw/2,0), P(seg,sw/2,sh), P(seg,-sw/2,sh)];
    pLen = P(seg/2, sw/2 + 18, sh/2);
    pW = P(-14, 0, -12);
    pH = P(-16, -sw/2 - 4, sh/2);
  }

  let sketch = '';
  for (let i = 0; i < 4; i++) {
    sketch += L(c0[i], c0[(i+1)%4]);
    sketch += L(c1[i], c1[(i+1)%4]);
    sketch += L(c0[i], c1[i]);
  }
  const lenLabel = pose.key === 'diag' ? ('斜长 '+lenVal) : ('长 '+lenVal);
  sketch += Tx(pLen, lenLabel, col, 13);
  sketch += Tx(pW, '宽 '+wVal, muted, 12);
  sketch += Tx(pH, '高 '+hVal, muted, 12);

  const foot =
    `<text x="168" y="188" text-anchor="middle" fill="#9aa3ad" font-size="11" font-family="${font}">` +
      `${esc(orient.rule)}` +
    `</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="${W}" height="${H}" fill="transparent"/>
    <text x="168" y="16" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="${font}">${esc(title)}</text>
    ${sketch}${foot}
  </svg>`;
}

function jointStepsHtml(b){
  return jointEnds(b).map(e => {
    const names = e.hits.map(h => esc(h.nick)).join('、');
    return `<li><span class="n">焊</span><span><b>${esc(e.tag)}</b> → ${names}</span></li>`;
  }).join('');
}
/** 师傅施工卡：一句话怎么放 + 两端图 + 截面 */
function sheetBodyHtml(b){
  const pose = poseOf(b);
  const orient = sectionOrient(b);
  const sec = b.section || '—';
  const poseCls = pose.key === 'up' ? 'up' : (pose.key === 'diag' ? 'diag' : 'flat');
  const callCls = pose.key === 'up' ? '' : poseCls;
  return (
    `<div class="tip-callout ${callCls}">` +
      `${esc(pose.how)}　·　下料 ${b.len} mm　·　${esc(sec)}` +
      `<small>${esc(orient.rule)}</small>` +
    `</div>` +
    `<div class="tip-stage" style="margin-top:10px">${assembleSvg(b)}</div>` +
    `<div class="tip-how">` +
      `<div class="tip-how-title">两头焊谁</div>` +
      `<ul class="tip-steps">${jointStepsHtml(b)}</ul>` +
    `</div>`
  );
}
function closeSheet(){
  sheetEl.classList.remove('open');
  sheetEl.style.display = 'none';
  sheetEl.innerHTML = '';
  sheetEl.setAttribute('aria-hidden', 'true');
}
function pieceIdsOf(b){
  if (!b) return [];
  if (b.kind === 'seg' && b.pieceId) {
    return SEGS.filter(s => s.pieceId === b.pieceId).map(s => s.id);
  }
  if (b.piece) {
    return SEGS.filter(s => s.pieceId === b.id || s.piece === b.piece).map(s => s.id);
  }
  return [];
}
function masterOf(b){
  if (!b) return null;
  if (b.kind === 'seg' && b.pieceId) return STEELS.find(s => s.id === b.pieceId) || b;
  return b;
}
function resetMeshMat(id){
  if (!meshById.has(id)) return;
  const p = meshById.get(id);
  if (p.userData.kind === 'marker') p.material = markerMat;
  else p.material = steelMatFor(p.userData).clone();
}
function clearHighlight(){
  if (current) {
    const cur = BOXES.find(b => b.id === current);
    const ids = pieceIdsOf(cur);
    if (ids.length) ids.forEach(resetMeshMat);
    else resetMeshMat(current);
  }
  current=null;
  document.querySelectorAll('#list .row').forEach(r=>r.classList.remove('active'));
  tipEl.classList.remove('open');
  tipEl.style.display='none';
  tipEl.innerHTML='';
  closeSheet();
}
function openSheet(b){
  const master = masterOf(b) || b;
  const sec = master.section || '—';
  sheetEl.style.display = 'flex';
  sheetEl.classList.add('open');
  sheetEl.setAttribute('aria-hidden', 'false');
  sheetEl.innerHTML =
    `<div class="sheet-card" id="sheetCard">` +
      `<div class="sheet-bar">` +
        `<div class="sheet-bar-main">` +
          `<div class="sheet-title">${esc(master.id)}　${esc(master.name)}</div>` +
          `<div class="sheet-sub">施工卡 · ${master.len} mm · ${esc(sec)}</div>` +
        `</div>` +
        `<button type="button" class="sheet-close" id="sheetClose" aria-label="关闭弹框">×</button>` +
      `</div>` +
      `<div class="sheet-body">${sheetBodyHtml(master)}</div>` +
    `</div>`;
  document.getElementById('sheetClose').onclick = (ev)=>{ ev.stopPropagation(); closeSheet(); };
  document.getElementById('sheetCard').onclick = (ev)=> ev.stopPropagation();
  sheetEl.onclick = ()=> closeSheet();
}
const HOWTO_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="currentColor" opacity=".55"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="currentColor" opacity=".55"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="currentColor"/></svg>`;

function highlight(id, focus=false){
  closeSheet();
  const raw = BOXES.find(b => b.id === id);
  const master = masterOf(raw) || raw;
  const listId = master ? master.id : id;
  if (current && current !== listId && current !== id) {
    const prev = BOXES.find(b => b.id === current);
    const prevIds = pieceIdsOf(prev);
    if (prevIds.length) prevIds.forEach(resetMeshMat);
    else resetMeshMat(current);
  }
  current = listId;
  document.querySelectorAll('#list .row').forEach(r=>r.classList.toggle('active', r.dataset.id===listId));
  const ids = pieceIdsOf(master) || pieceIdsOf(raw);
  if (ids.length) {
    ids.forEach(sid => {
      const m = meshById.get(sid);
      if (m) m.material = hiMat;
    });
  } else {
    const mesh = meshById.get(id);
    if (!mesh || mesh.userData.kind === 'marker') return;
    mesh.material = hiMat;
  }
  const b = master || raw;
  if (!b) return;
  const sec = b.section || '—';
  const secClass = sec === '40×40' ? 's4040' : 's4060';
  const kind = b.diag ? '斜杆' : '直杆';
  tipEl.style.display='flex';
  tipEl.classList.add('open');
  tipEl.innerHTML =
    `<div class="tip-main">` +
      `<div class="tip-head">` +
        `<span class="tip-id">${esc(b.id)}</span>` +
        `<span class="tip-name">${esc(b.name)}</span>` +
      `</div>` +
      `<div class="tip-row">` +
        `${kind} · 下料 <span class="tip-len">${b.len}</span> mm` +
        `<span class="tip-sec ${secClass}">${esc(sec)}</span>` +
      `</div>` +
    `</div>` +
    `<div class="tip-actions">` +
      `<button type="button" class="tip-howto" id="tipHowto" title="施工拼法" aria-label="打开施工拼法">${HOWTO_ICON}</button>` +
      `<button type="button" class="tip-close" id="tipClose" aria-label="关闭">×</button>` +
    `</div>`;
  document.getElementById('tipHowto').onclick = (ev)=>{ ev.stopPropagation(); openSheet(b); };
  document.getElementById('tipClose').onclick = (ev)=>{ ev.stopPropagation(); clearHighlight(); };
  if (focus) {
    const focusMesh = ids.length ? meshById.get(ids[Math.floor(ids.length/2)]) : meshById.get(id);
    if (focusMesh) {
      controls.target.copy(focusMesh.position);
      const d=camera.position.clone().sub(controls.target).setLength(isMobile ? 2800 : 2200);
      camera.position.copy(controls.target.clone().add(d));
    }
  }
}

const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2();
let ptrDown = null;
renderer.domElement.addEventListener('pointerdown', (ev)=>{
  if(ev.button!==0) return;
  ptrDown = { x: ev.clientX, y: ev.clientY, id: ev.pointerId };
});
renderer.domElement.addEventListener('pointerup', (ev)=>{
  if(!ptrDown || ptrDown.id !== ev.pointerId) return;
  const dx = ev.clientX - ptrDown.x, dy = ev.clientY - ptrDown.y;
  ptrDown = null;
  if(dx*dx + dy*dy > 36) return; // 拖转不算点选
  if (sheetEl.classList.contains('open')) { closeSheet(); return; }
  pointer.x=(ev.clientX/innerWidth)*2-1; pointer.y=-(ev.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const pick = [...meshById.values()].filter(m => m.userData.kind === 'steel' || m.userData.kind === 'seg');
  const hits=raycaster.intersectObjects(pick, false);
  if(hits.length) highlight(hits[0].object.userData.id, false);
  else clearHighlight();
});
renderer.domElement.addEventListener('pointercancel', ()=>{ ptrDown = null; });
tipEl.addEventListener('pointerdown', (ev)=> ev.stopPropagation());
addEventListener('keydown', (ev)=>{
  if(ev.key !== 'Escape') return;
  if (sheetEl.classList.contains('open')) closeSheet();
  else clearHighlight();
});

document.getElementById('btnReset').onclick=()=>{
  camera.position.set(isMobile ? 3800 : 3200, isMobile ? 2800 : 2400, isMobile ? 3200 : 2800);
  controls.target.set(1400,700,900);
};
document.getElementById('btnTube').onclick=()=>{ labelGroup.visible=!labelGroup.visible; };
document.getElementById('btnOverall').onclick=()=>{ overallGroup.visible=!overallGroup.visible; };
labelGroup.visible = false;   // 杆件尺寸默认关，避免打架
overallGroup.visible = true;  // 只留外形关键尺

function onResize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', ()=> setTimeout(onResize, 200));
(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();

} catch (err) {
  showBootError(err);
}
</script>
</body>
</html>
