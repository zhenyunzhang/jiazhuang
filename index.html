function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/** CAD 尺寸文字：贴在尺寸线旁，随模型缩放 */
function makeDimLabel(text, pos, worldW=420) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const canvas = document.createElement('canvas');
  canvas.width = 512 * dpr; canvas.height = 128 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, 512, 128);
  ctx.fillStyle = 'rgba(12,14,18,0.82)';
  roundRect(ctx, 8, 20, 496, 88, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,87,0.9)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ffe6a8';
  ctx.font = '700 44px "PingFang SC","Helvetica Neue",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = 44;
  while (fs > 28 && ctx.measureText(text).width > 460) {
    fs -= 2; ctx.font = `700 ${fs}px "PingFang SC","Helvetica Neue",sans-serif`;
  }
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: true, depthWrite: false,
    sizeAttenuation: true,
  }));
  sp.scale.set(worldW, worldW * 0.25, 1);
  sp.position.copy(pos);
  sp.renderOrder = 2;
  return sp;
}

function addSeg(group, a, b, mat) {
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat));
}

/** CAD 尺寸：测量 p1–p2，沿 offset 外移 */
function addCadDim(group, p1, p2, text, offset, labelScale) {
  const o = offset.clone();
  const a = p1.clone().add(o);
  const b = p2.clone().add(o);
  const dimDir = new THREE.Vector3().subVectors(b, a);
  const dimLen = dimDir.length();
  if (dimLen < 1) return;
  dimDir.multiplyScalar(1 / dimLen);
  const over = o.clone().normalize().multiplyScalar(36);
  addSeg(group, p1, a.clone().add(over), dimExtMat);
  addSeg(group, p2, b.clone().add(over), dimExtMat);
  addSeg(group, a, b, dimMat);
  let tick = new THREE.Vector3().crossVectors(dimDir, o).normalize();
  if (tick.lengthSq() < 1e-6) {
    tick = new THREE.Vector3().crossVectors(dimDir, new THREE.Vector3(0, 1, 0)).normalize();
  }
  if (tick.lengthSq() < 1e-6) tick.set(1, 0, 0);
  const th = 55;
  addSeg(group, a.clone().addScaledVector(tick, -th), a.clone().addScaledVector(tick, th), dimMat);
  addSeg(group, b.clone().addScaledVector(tick, -th), b.clone().addScaledVector(tick, th), dimMat);
  const mid = a.clone().add(b).multiplyScalar(0.5).add(o.clone().normalize().multiplyScalar(70));
  const w = labelScale || Math.min(520, Math.max(280, dimLen * 0.22));
  group.add(makeDimLabel(text, mid, w));
}

BOXES.forEach(b => {
  let mesh;
  if (b.diag) {
    const p1 = toThree(b.x1, b.y1, b.z1);
    const p2 = toThree(b.x2, b.y2, b.z2);
    const len = p1.distanceTo(p2);
    const geo = new THREE.BoxGeometry(b.dx, b.dx, len);
    mesh = new THREE.Mesh(geo, diagMat.clone());
    mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
    mesh.lookAt(p2);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
  } else {
    const geo = new THREE.BoxGeometry(b.dx, b.dz, b.dy);
    let mat = steelMat;
    if (b.kind === 'floor') mat = floorMat;
    else if (b.kind === 'marker') mat = markerMat;
    else if ((b.name||'').includes('围挡')) mat = railMat;
    mesh = new THREE.Mesh(geo, mat === floorMat || mat === markerMat ? mat : mat.clone());
    mesh.position.copy(toThree(b.cx, b.cy, b.cz));
    if (b.kind === 'steel') {
      mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
    }
  }
  mesh.userData = b;
  if (b.kind === 'steel') {
    mesh.castShadow = !isMobile;
    meshById.set(b.id, mesh);
    if (b.showLabel && !b.diag) {
      const p = toThree(b.cx, b.cy, b.cz);
      const axis = b.dx >= b.dy && b.dx >= b.dz ? 'x' : (b.dy >= b.dz ? 'y' : 'z');
      let p1, p2, off;
      if (axis === 'z') {
        p1 = p.clone().add(new THREE.Vector3(0, -b.dz/2, 0));
        p2 = p.clone().add(new THREE.Vector3(0,  b.dz/2, 0));
        off = new THREE.Vector3(120, 0, 120);
      } else if (axis === 'x') {
        p1 = p.clone().add(new THREE.Vector3(-b.dx/2, 0, 0));
        p2 = p.clone().add(new THREE.Vector3( b.dx/2, 0, 0));
        off = new THREE.Vector3(0, 100, -120);
      } else {
        p1 = p.clone().add(new THREE.Vector3(0, 0, -b.dy/2));
        p2 = p.clone().add(new THREE.Vector3(0, 0,  b.dy/2));
        off = new THREE.Vector3(120, 80, 0);
      }
      addCadDim(labelGroup, p1, p2, String(b.len), off, Math.min(400, Math.max(240, b.len * 0.18)));
    }
  } else if (b.kind === 'marker') {
    meshById.set(b.id, mesh);
  }
  root.add(mesh);
});

let current=null;
function highlight(id, focus=false){
  if(current && meshById.has(current)){
    const p=meshById.get(current), n=p.userData.name||'';
    if(p.userData.kind==='marker') p.material=markerMat;
    else if(p.userData.diag) p.material=diagMat.clone();
    else if(n.includes('围挡')) p.material=railMat.clone();
    else p.material=steelMat.clone();
  }
  current=id;
  document.querySelectorAll('#list .row').forEach(r=>r.classList.toggle('active', r.dataset.id===id));
  const mesh=meshById.get(id); if(!mesh||mesh.userData.kind==='marker') return;
  mesh.material=hiMat;
  const tip=document.getElementById('tip'); const b=mesh.userData;
  tip.style.display='block';
  tip.textContent=`${b.id}  ${b.name}  下料 ${b.len} mm`;
  if(focus){
    controls.target.copy(mesh.position);
    const d=camera.position.clone().sub(controls.target).setLength(isMobile ? 2800 : 2200);
    camera.position.copy(controls.target.clone().add(d));
  }
}

const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2();
let ptrDown = null;
renderer.domElement.addEventListener('pointerdown', (ev)=>{
  if(ev.button!==0) return;
  ptrDown = { x: ev.clientX, y: ev.clientY, id: ev.pointerId };
});
renderer.domElement.addEventListener('pointerup', (ev)=>{
  if(!ptrDown || ptrDown.id !== ev.pointerId) return;
  const dx = ev.clientX - ptrDown.x, dy = ev.clientY - ptrDown.y;
  ptrDown = null;
  if(dx*dx + dy*dy > 36) return; // 拖转不算点选
  pointer.x=(ev.clientX/innerWidth)*2-1; pointer.y=-(ev.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hits=raycaster.intersectObjects([...meshById.values()].filter(m=>m.userData.kind==='steel'), false);
  if(hits.length) highlight(hits[0].object.userData.id, false);
});
renderer.domElement.addEventListener('pointercancel', ()=>{ ptrDown = null; });

document.getElementById('btnReset').onclick=()=>{
  camera.position.set(isMobile ? 3800 : 3200, isMobile ? 2800 : 2400, isMobile ? 3200 : 2800);
  controls.target.set(1400,700,900);
};
document.getElementById('btnTube').onclick=()=>{ labelGroup.visible=!labelGroup.visible; };
document.getElementById('btnOverall').onclick=()=>{ overallGroup.visible=!overallGroup.visible; };
labelGroup.visible = false;   // 杆件标尺默认关，避免堆叠
overallGroup.visible = true;  // 外形 CAD 尺寸默认开

function onResize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', ()=> setTimeout(onResize, 200));
(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
